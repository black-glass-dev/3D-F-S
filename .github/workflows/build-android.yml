name: Build Android APK

# কখন বিল্ড হবে:
#  - ম্যানুয়ালি (Actions ট্যাব → Run workflow)
#  - main ব্রাঞ্চে push হলে
#  - build- দিয়ে শুরু হওয়া ট্যাগ push হলে
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'build-*'

jobs:
  build:
    name: Build Android APK (Unity)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      # 1) কোড চেকআউট
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2) ডিস্ক স্পেস খালি করা (Unity + Android মডিউলের জন্য জায়গা দরকার)
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      # 3) Unity 2022.3 ইনস্টল (Android বিল্ড সাপোর্টসহ) — ভার্সন ProjectVersion.txt থেকে
      - name: Install Unity 2022.3 + Android module
        id: unity
        uses: buildalon/unity-setup@v3
        with:
          # ProjectSettings.asset এখনো তৈরি হয়নি (Unity প্রথমবার খোলার সময় বানায়),
          # তাই ভার্সন সরাসরি দেওয়া হচ্ছে — অ্যাকশনের Android SDK চেক এড়াতে।
          version-file: 'None'
          unity-version: '2022.3.62f3 (96770f904ca7)'
          build-targets: Android
          cache-installation: true

      # 3.5) Unity-র জন্য দরকারি Linux সিস্টেম লাইব্রেরি
      #      ক্যাশ থেকে এডিটর রিস্টোর হলে এই লাইব্রেরিগুলো ইনস্টল হয় না — তাই নিজে করি।
      - name: Install Unity runtime libraries
        shell: bash
        run: |
          set +e
          sudo apt-get update -qq
          PKGS="libglu1-mesa libxcursor1 libxrandr2 libxinerama1 libxi6 libxtst6 libnss3 libgbm1
                libasound2 libasound2t64 libgtk-3-0 libgtk-3-0t64 libgdk-3-0 libgdk-3-0t64
                libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libcairo-gobject2 libatk1.0-0
                libatk1.0-0t64 libatk-bridge2.0-0 libatk-bridge2.0-0t64 libatspi2.0-0 libatspi2.0-0t64
                libxt6 libsm6 libice6 libxkbcommon0 libxext6 libfontconfig1 libfreetype6 zlib1g
                libglib2.0-0 libglib2.0-0t64 libdbus-1-3 libexpat1 libudev1 libcap2 libgcrypt20
                liblz4-1 liblzma5 libgpg-error0 libnspr4 libsecret-1-0 libnotify4 libxml2 libssl3
                libbz2-1.0 libpcre3 libpcre2-8-0 libxss1 libuuid1 libx11-6 libxcb1 libxcomposite1
                libxdamage1 libxfixes3 libxrender1 libdrm2 libepoxy0 libwayland-client0"
          for p in $PKGS; do
            sudo apt-get install -y -qq "$p" > /dev/null 2>&1 && echo "ok   $p" || echo "skip $p"
          done
          sudo ldconfig

          # Unity বাইনারি খুঁজে বাকি যা মিসিং আছে সেগুলোও ইনস্টল করার চেষ্টা
          UNITY=$(find "$UNITY_EDITOR_PATH" -maxdepth 4 -type f -name Unity -perm -u+x 2>/dev/null | head -n 1)
          echo "unity binary: $UNITY"
          for round in 1 2 3; do
            MISSING=$(ldd "$UNITY" 2>/dev/null | grep "not found" | awk '{print $1}' | sort -u)
            [ -z "$MISSING" ] && break
            echo "missing (round $round): $MISSING"
            for lib in $MISSING; do
              base=${lib%%.so*}
              for cand in "${base}0t64" "${base}0" "${base}" "${base}-0t64" "${base}-0" "${base}1.0-0"; do
                sudo apt-get install -y -qq "$cand" > /dev/null 2>&1 && break
              done
            done
            sudo ldconfig
          done
          echo "still missing:"
          ldd "$UNITY" 2>/dev/null | grep "not found" || echo "  none"

      # 4) Unity Personal (ফ্রি) লাইসেন্স অনলাইনে চালু
      #    দরকারি Secrets (Settings > Secrets and variables > Actions):
      #      UNITY_EMAIL    — Unity অ্যাকাউন্টের ইমেইল
      #      UNITY_PASSWORD — Unity অ্যাকাউন্টের পাসওয়ার্ড
      #    কোনো .alf/.ulf ফাইল লাগে না।
      - name: Activate Unity Personal license
        uses: buildalon/activate-unity-license@v3
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      # 5) APK বিল্ড
      - name: Build APK
        shell: bash
        run: |
          set +e          # নিজে এরর হ্যান্ডল করা হবে (GitHub ডিফল্টে -e চালায়)
          set -o pipefail

          echo "workspace: $GITHUB_WORKSPACE"
          echo "UNITY_EDITOR_PATH=[$UNITY_EDITOR_PATH]"

          # Unity এক্সিকিউটেবল খোঁজা (পথ ফাইল না ফোল্ডার — দুটোই সামলায়)
          UNITY=""
          for candidate in "$UNITY_EDITOR_PATH" "$UNITY_EDITOR_PATH/Editor/Unity"; do
            if [ -n "$candidate" ] && [ -f "$candidate" ] && [ -x "$candidate" ]; then
              UNITY="$candidate"; break
            fi
          done
          if [ -z "$UNITY" ] && [ -d "$UNITY_EDITOR_PATH" ]; then
            UNITY=$(find "$UNITY_EDITOR_PATH" -maxdepth 4 -type f -name Unity -perm -u+x 2>/dev/null | head -n 1)
          fi
          echo "Using Unity: [$UNITY]"

          if [ -z "$UNITY" ]; then
            echo "::error::Unity executable not found under [$UNITY_EDITOR_PATH]"
            find "$UNITY_EDITOR_PATH" -maxdepth 3 2>/dev/null | head -n 10 | while IFS= read -r l; do
              echo "::warning::DIAG $l"
            done
            exit 1
          fi

          # বিল্ড চালানো — সব আউটপুট ফাইলে রাখা হয়
          "$UNITY" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod FarmSim.Editor.CiBuild.PerformBuild \
            -logFile /dev/stdout > unity-build.log 2>&1
          STATUS=$?
          echo "Unity exit code: $STATUS"

          if [ "$STATUS" -ne 0 ] || [ ! -f build/Android/FarmSim.apk ]; then
            echo "=== errors from unity-build.log ==="
            grep -aE "error CS[0-9]+|Error:|Exception|executeMethod|Build finished|FAILED|Compilation failed|Aborting" \
              unity-build.log 2>/dev/null | head -n 8 | while IFS= read -r l; do
              echo "::error::UNITY $l"
            done
            if grep -aq "error while loading shared libraries" unity-build.log 2>/dev/null; then
              echo "=== missing shared libraries ==="
              ldd "$UNITY" 2>/dev/null | grep "not found" | head -n 8 | while IFS= read -r l; do
                echo "::error::LIB $l"
              done
            fi
            echo "=== tail of unity-build.log ==="
            tail -n 12 unity-build.log 2>/dev/null | while IFS= read -r l; do
              echo "::warning::TAIL $l"
            done
            exit 1
          fi

          echo "APK built successfully"
      # 6) APK তৈরি হয়েছে কিনা যাচাই
      - name: Verify APK exists
        run: |
          ls -lh build/Android/ || true
          test -f build/Android/FarmSim.apk

      # 7) APK আপলোড — Actions রান পেজ থেকে ডাউনলোড করা যাবে (30 দিন থাকবে)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmSim-Android-APK
          path: build/Android/FarmSim.apk
          if-no-files-found: error
          retention-days: 30

      # 8) build-* ট্যাগ হলে APK-টা GitHub Release-এ সরাসরি যুক্ত হয় (এক ক্লিকে ডাউনলোড)
      - name: Publish APK as a Release asset
        if: startsWith(github.ref, 'refs/tags/build-')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Android/FarmSim.apk
          name: Farm Simulator — ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            🌾 3D Farm Simulator (Unity 2.5D isometric) — Android APK

            - ফোনে ইনস্টল করতে নিচের `FarmSim.apk` ফাইলটা ডাউনলোড করুন
            - Android 7.0+ (ARM64), ল্যান্ডস্কেপ, বাংলা/English UI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
